name: BACKEND CI -- Build & Test
on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  ci_backend:
    name: backend - Lint, typecheck, test
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      elasticsearch:
        image: elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports: ['9200:9200']
        options: >-
          --health-cmd="curl -s http://localhost:9200"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
                          
    steps:
      - uses: actions/checkout@v4
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend
        
      - name: Lint
        run: npm run lint
        working-directory: ./backend            

      - name: Type Check
        run: npm run typecheck
        working-directory: ./backend
        
      - name: Run migrations
        run: npm run db:migrate
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Test
        run: npm run test -- --reporter=junit --output-dir=test-results/results.xml
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_HOST: 127.0.0.1
          ELASTICSEARCH_URL: http://localhost:9200
          SECRET_KEY: test_secret_for_ci
          NODE_ENV: test
        working-directory: ./backend

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./backend/test-results
              
  security_scan:
    name: Security Scan - dependency audit
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: ./backend
        continue-on-error: true