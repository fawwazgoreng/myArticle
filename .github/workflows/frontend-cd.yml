name: FRONTEND CD -- Deploy
on:
    workflow_run:
         workflows: ["FRONTEND CI -- Build & Test"]
         types: [completed]
         branches: [main]

jobs:
    docker_build:
        name: Docker Build & Push
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        strategy:
            matrix:
                service: [frontend]
            fail-fast: false
        steps:
            - uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  registry: registry.example.com
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v4
              with:
                  images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}
                  tags: |
                      type=sha,format=long
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./${{ matrix.service }}
                  push: true
                  target: production
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

                  cache-from: type=registry,ref=registry.example.com/sosmed/${{ matrix.service }}:buildcache
                  cache-to: type=registry,ref=registry.example.com/sosmed/${{ matrix.service }}:buildcache,mode=max
                  build-args: |
                      BUILD_NUM=${{ github.run_number }}
                      GIT_SHA=${{ github.sha }}

    deploy_staging:
         name: Deploy to Staging
         needs: docker_build
         runs-on: ubuntu-latest
         strategy:
             matrix:
                 service: [frontend]
             fail-fast: false
         environment:
             name: staging
             url: https://staging.example.com
         steps:
           - uses: actions/checkout@v4

           - name: Deploy staging to server via ssh
             uses: appleboy/ssh-action@v1
             with:
               host: ${{ secrets.STAGING_HOST }}
               username: ${{ secrets.STAGING_USERNAME }}
               key: ${{ secrets.STAGING_SSH_KEY }}
               script:
                    cd /opt/sosmed

                    export TAG=build-${{ github.run_number }}
                    docker pull registry.example.com/sosmed/${{ matrix.service }}:$TAG
                    docker tag registry.example.com/sosmed/${{ matrix.service }}:$TAG

                    FRONTEND_TAG=${TAG} \
                    docker-compose up -d --no-deps frontend

                    sleep 10
                    curl -sf http://localhost:3001/health || exit 1
                    curl -sf http://localhost:3000 || exit 1
                    echo "deploy staging success"
                    
                    
                    docker image prune -af --filter "until=72h"
