services:
    api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: myArticle_api
        restart: always
        ports:
            - "3000:3000"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
            interval: 10s
            timeout: 5s
            retries: 3
        environment:
            - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/redis?schema=public
            - DATABASE_POST=5432
            - DATABASE_PASSWORD=${DB_PASSWORD}
            - DATABASE_USER=postgres
            - DATABASE_NAME=redis
            - NODE_ENV=development
            - APP_NAME=article
            - REDIS_PORT=6379
            - REDIS_DB=0
            - REDIS_HOST=cache
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - FRONT_END_URL=http://web:3000
            - SECRET_KEY=${SECRET_KEY}
            - ELASTICSEARCH_URL=http://search:9200
            - ELASTICSEARCH_API_KEY=${ELASTICSEARCH_API_KEY}
        depends_on:
            db:
                condition: service_healthy
            cache:
                condition: service_healthy
            search:
                condition: service_healthy
        networks:
            - app_network

    web:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: myArticle_web
        restart: always
        volumes:
          - .:app
          - /app/node_modules
          - /app/.nuxt
        ports:
            - "80:3000"
        environment:
            - NUXT_PUBLIC_API_BASEURL=http://localhost:3000
            - NODE_ENV=development
            - NODE_TLS_REJECT_UNAUTHORIZED=0
            - NUXT_PUBLIC_BASE_IMAGE=http://localhost:3000/static
        networks:
            - app_network
        depends_on:
            api:
                condition: service_healthy

    db:
        image: postgres:15-alpine
        container_name: postgres
        restart: always
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=redis
        networks:
            - app_network
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d redis"]
            interval: 10s
            timeout: 5s
            retries: 5

    cache:
        image: redis:alpine
        container_name: redis
        restart: always
        networks:
            - app_network
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    search:
        image: elasticsearch:8.10.2
        container_name: search
        restart: always
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=true
            - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
            - xpack.security.http.ssl.enabled=false
            - xpack.security.transport.ssl.enabled=false 
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        networks:
            - app_network
        ports:
            - "9200:9200"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -s http://localhost:9200 >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:

networks:
    app_network:
        driver: bridge
